spring:
  datasource:  #메모리에 임시 DB를 만들어서 쓰겠다.
    url: jdbc:h2:mem:testdb
  h2:
    console:
      enabled: true # 웹 콘솔 활성화
      path: /h2-console # http://localhost:8080/h2-console
  jpa:
    # 전송 쿼리 확인
    show-sql: true
    properties:
      hibernate:
        format_sql: true # SQL을 줄바꿈해서 보기 좋게 출력

    # 테이블 생성 후에 data.sql 실행
    defer-datasource-initialization: true